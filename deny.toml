# cargo-deny config for barehttp (C-PERMISSIVE / rust-api-design verification).
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "thumbv7em-none-eabi",
]
all-features = true

[advisories]
ignore = []

[licenses]
# Permissive SPDX allow-list for this crate and its dependency tree.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0", # unicode-ident
  "Zlib",        # foldhash (via hashbrown)
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
