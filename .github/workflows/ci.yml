name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # default = [] — none == --no-default-features
          - name: none
            args: --no-default-features
          - name: cookie-jar
            args: --no-default-features --features cookie-jar
          - name: gzip
            args: --no-default-features --features gzip-decompression
          - name: zstd
            args: --no-default-features --features zstd-decompression
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            args: --no-default-features
          - name: cookie-jar
            args: --no-default-features --features cookie-jar
          - name: gzip
            args: --no-default-features --features gzip-decompression
          - name: zstd
            args: --no-default-features --features zstd-decompression
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}

      # Does not pass --ignored: live httpbin tests stay skipped.
      - name: Test
        run: cargo test --locked ${{ matrix.args }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: examples

      # Build only — do not run live/network examples (e.g. httpbin).
      - name: Build examples
        run: cargo build --locked --examples --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.97

      - name: Check (all features)
        run: cargo check --locked --all-features

      - name: Test (all features)
        run: cargo test --locked --all-features

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: lockfile

      - name: Verify Cargo.lock matches manifests
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Report available dependency updates (informational)
        run: cargo update -w --dry-run

      - name: Dependency tree sanity
        run: cargo tree -e features --all-features

  os-matrix:
    name: OS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: os-${{ matrix.os }}

      - name: Test (default / none)
        run: cargo test --locked --no-default-features

      - name: Test (all features)
        run: cargo test --locked --all-features
