name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Pinned so install-action cache keys stay stable across runs.
  NEXTEST_VERSION: "0.9.140"
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            args: --no-default-features
          - name: cookie-jar
            args: --no-default-features --features cookie-jar
          - name: gzip
            args: --no-default-features --features gzip
          - name: zstd
            args: --no-default-features --features zstd
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}

      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings

  test:
    name: Nextest (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            args: --no-default-features
          - name: cookie-jar
            args: --no-default-features --features cookie-jar
          - name: gzip
            args: --no-default-features --features gzip
          - name: zstd
            args: --no-default-features --features zstd
          - name: all
            args: --all-features
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary (not cargo install); version pin keeps cache/install stable.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nextest-${{ matrix.name }}

      # Unit + integration (local mock server). Ignored httpbin tests stay skipped.
      - name: Nextest (lib + tests)
        run: cargo nextest run --profile ci --locked ${{ matrix.args }}

  feature-matrix:
    name: Feature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-matrix

      - name: Check feature combos (host)
        run: |
          cargo check --locked --no-default-features
          cargo check --locked --no-default-features --features cookie-jar
          cargo check --locked --no-default-features --features gzip
          cargo check --locked --no-default-features --features zstd
          cargo check --locked --all-features

      - name: Embedded target (thumbv7em-none-eabi)
        run: |
          cargo check --locked --target thumbv7em-none-eabi --no-default-features
          cargo check --locked --target thumbv7em-none-eabi --features gzip

  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: miri

      - name: Miri (sync + focused)
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          cargo miri setup
          cargo miri test --lib sync::
          cargo miri test --lib --features gzip gzip::
          cargo miri test --lib --features cookie-jar cookie_jar::

  fuzz-build:
    name: Fuzz build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly

      # libfuzzer-sys links via clang; ubuntu-latest does not ship it by default.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # Prebuilt via install-action/binstall; pin avoids rebuilding each run.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-build

      # install-action ships a musl-built cargo-fuzz binary; its default --target is
      # therefore x86_64-unknown-linux-musl (CURRENT_PLATFORM of the binary). That
      # conflicts with -Zsanitizer=address (static CRT) and needs a musl std that
      # isn't installed. Pin the GNU host triple instead.
      - name: Build fuzz targets
        run: cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: examples

      - name: Build examples
        run: cargo build --locked --examples --all-features

  # Compile all benches; run Callgrind with soft limits vs previous baseline in cache.
  # First run on a cold cache always passes; later runs fail on >5% Ir / >10% cycles.
  benches:
    name: Benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Install gungraun-runner
        uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@0.19.4

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: benches
          cache-targets: true

      - name: Cache Gungraun baselines
        uses: actions/cache@v4
        with:
          path: |
            target/gungraun
            .gungraun
          key: gungraun-${{ runner.os }}-${{ hashFiles('benches/**', 'src/**', 'Cargo.lock') }}
          restore-keys: |
            gungraun-${{ runner.os }}-

      - name: Compile all benches
        run: cargo bench --locked --no-run --all-features

      - name: Callgrind regression (soft limits)
        run: cargo bench --locked --bench gungraun_callgrind --all-features

      - name: Criterion smoke (compile + short run)
        run: |
          cargo bench --locked --bench criterion_hot_paths --all-features -- \
            --warm-up-time 0.2 --measurement-time 0.5 --sample-size 10
          cargo bench --locked --bench criterion_e2e --all-features -- \
            --warm-up-time 0.2 --measurement-time 0.5 --sample-size 10

      - name: dhat allocation smoke
        env:
          BAREHTTP_DHAT_ITERS: "5"
        run: |
          cargo bench --locked --bench dhat_parser --all-features
          cargo bench --locked --bench dhat_gzip --features gzip
          cargo bench --locked --bench dhat_e2e --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.97

      - name: Check (all features)
        run: cargo check --locked --all-features

      - name: Nextest (all features)
        run: cargo nextest run --profile ci --locked --all-features

  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: lockfile

      - name: Verify Cargo.lock matches manifests
        run: cargo metadata --format-version 1 --locked >/dev/null

      - name: Report available dependency updates (informational)
        run: cargo update --dry-run

      - name: Dependency tree sanity
        run: cargo tree -e features --all-features

  os-matrix:
    name: OS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: os-${{ matrix.os }}

      - name: Nextest (default / none)
        run: cargo nextest run --profile ci --locked --no-default-features

      - name: Nextest (all features)
        run: cargo nextest run --profile ci --locked --all-features
