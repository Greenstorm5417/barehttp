# nextest profiles for barehttp
# https://nexte.st/docs/configuration/reference/

[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.ci.junit]
path = "target/nextest-junit.xml"
